<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Orders | 10-10 Women's Wear ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-gem"></i>
            <span>10-10 ERP</span>
        </div>
        <nav>
            <a href="index.html" class="nav-link">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="vendors.html" class="nav-link">
                <i class="fas fa-building"></i>
                <span>Vendor Master</span>
            </a>
            <a href="vendor-material.html" class="nav-link">
                <i class="fas fa-box-open"></i>
                <span>Vendor Material Entry</span>
            </a>
            <a href="warehouse-acceptance.html" class="nav-link">
                <i class="fas fa-clipboard-check"></i>
                <span>Warehouse Acceptance</span>
            </a>
            <a href="seller-orders.html" class="nav-link">
                <i class="fas fa-dolly"></i>
                <span>Seller Orders</span>
            </a>
            <a href="dispatch-material.html" class="nav-link">
                <i class="fas fa-truck-loading"></i>
                <span>Dispatch Material</span>
            </a>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0">Seller Orders</h4>
                <p class="text-muted small">Create orders for retail distribution</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative">
                    <i class="fas fa-bell fs-5 text-gray"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        style="font-size: 0.6rem">3</span>
                </div>
                <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff"
                    class="rounded-circle shadow-sm" width="40" alt="Profile" />
            </div>
        </div>

        <!-- Seller Orders Content -->
        <div class="glass-card">
            <h5 class="fw-bold mb-4">
                <i class="fas fa-dolly me-2"></i>Seller Order Entry
            </h5>
            <form id="distributorForm">
                <!-- Header Info Row -->
                <div class="row g-3 mb-4 bg-light p-3 rounded-4 border mx-0">
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Select Hub / Retail
                            Destination</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="destinationHub" id="destMadrid"
                                    value="Madrid" checked />
                                <label class="form-check-label" for="destMadrid">Madrid</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="destinationHub" id="destBarcelona"
                                    value="Barcelona" />
                                <label class="form-check-label" for="destBarcelona">Barcelona</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Select Seller</label>
                        <select class="form-select" id="distSeller">
                            <option value="">Choose Seller</option>
                            <option value="Seller 1">Seller 1</option>
                            <option value="Seller 2">Seller 2</option>
                            <option value="Seller 3">Seller 3</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Ref ID</label>
                        <input type="text" class="form-control font-monospace text-muted small" value="DSP-001" readonly
                            style="background: #e9ecef;" />
                    </div>
                </div>

                <!-- Product Selection Grid -->
                <div class="row g-4 mb-4" id="distributor-product-grid">
                    <!-- Grid items will be injected by JavaScript -->
                </div>

                <!-- Financial Summary Section -->
                <div class="row g-3 mb-4 bg-light p-3 rounded-4 border mx-0">
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Total Amount</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                            <input type="text" class="form-control fw-bold border-start-0 bg-white" id="distTotalAmount"
                                value="0.00" readonly>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Amount Received</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                            <input type="number" class="form-control fw-bold border-start-0" id="distAmountReceived"
                                value="0" min="0" step="0.01">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1 text-danger">Amt
                            Pending</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-danger opacity-75">€</span>
                            <input type="text" class="form-control fw-bold border-start-0 bg-white text-danger"
                                id="distAmtPending" value="0.00" readonly>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-uppercase text-muted fw-bold ls-1">Order Booking
                            Date</label>
                        <input type="date" class="form-control fw-bold" id="distBookingDate">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" id="cancelDistBtn">
                        <i class="fas fa-times me-2"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>Process Seller Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="common.js"></script>
    <script src="seller-orders.js"></script>
</body>

</html>
