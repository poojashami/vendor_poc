<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Material Entry | 10-10 Women's Wear ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-gem"></i>
            <span>10-10 ERP</span>
        </div>
        <nav>
            <a href="index.html" class="nav-link">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="vendors.html" class="nav-link">
                <i class="fas fa-building"></i>
                <span>Vendor Master</span>
            </a>
            <a href="vendor-material.html" class="nav-link">
                <i class="fas fa-box-open"></i>
                <span>Vendor Material Entry</span>
            </a>
            <a href="warehouse-acceptance.html" class="nav-link">
                <i class="fas fa-clipboard-check"></i>
                <span>Warehouse Acceptance</span>
            </a>
            <a href="seller-orders.html" class="nav-link">
                <i class="fas fa-dolly"></i>
                <span>Seller Orders</span>
            </a>
            <a href="dispatch-material.html" class="nav-link">
                <i class="fas fa-truck-loading"></i>
                <span>Dispatch Material</span>
            </a>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0">Vendor Material Entry</h4>
                <p class="text-muted small">Submit material inventory for warehouse approval</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative">
                    <i class="fas fa-bell fs-5 text-gray"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        style="font-size: 0.6rem">3</span>
                </div>
                <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff"
                    class="rounded-circle shadow-sm" width="40" alt="Profile" />
            </div>
        </div>

        <!-- Vendor Material Entry Content -->
        <div class="glass-card">
            <h5 class="fw-bold mb-4">
                <i class="fas fa-box-open me-2"></i>Vendor Material Entry
            </h5>
            <form id="materialForm">
                <!-- Product Selection Grid -->
                <div class="row g-4 mb-4" id="material-selection-grid">
                    <!-- Grid items will be injected by JavaScript -->
                </div>

                <!-- Total Amount Display -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="bg-gradient rounded-3"
                            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                            <div class="d-flex align-items-center p-3">
                                <span class="h5 mb-0 fw-bold text-white me-3">Total Amount:</span>
                                <span class="h4 mb-0 fw-bold text-white" id="grandTotal">€0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dispatch & Remarks Section -->
                <div id="dispatch-section" style="display: none" class="animate-fade-in">
                    <h6 class="text-primary mb-3">
                        <i class="fas fa-warehouse me-2"></i>Dispatch Details
                    </h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label class="form-label">Dispatch to</label>
                            <select class="form-select" id="dispatchWarehouse" required>
                                <option value="" selected disabled>Select Warehouse</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Madrid">Madrid</option>
                                <option value="Barcelona">Barcelona</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Dispatch Date</label>
                            <input type="date" class="form-control" id="dispatchDate" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Expected Arrival</label>
                            <input type="date" class="form-control" id="expectedDate" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Remarks (Optional)</label>
                            <input type="text" class="form-control" id="remarks"
                                placeholder="Special instructions..." />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-paper-plane me-2"></i>Submit to Warehouse
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="common.js"></script>
    <script src="vendor-material.js"></script>
</body>

</html>
